services:
  mihomo:
    image: docker.io/metacubex/mihomo:v1.19.28@sha256:e6acd921addecfd59a8e2d38203f88356d635b54de6c0673db0e015139989312
    init: true
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    entrypoint: ["/bin/sh", "/bootstrap/mihomo-entrypoint.sh"]
    environment:
      MIHOMO_SECRET: ${MIHOMO_SECRET:?MIHOMO_SECRET must be set in .env}
      MIHOMO_SHARED_DIR: /shared-proxy
      MIHOMO_BIND_ADDRESS: 0.0.0.0
      MIHOMO_CONTROLLER_BIND_ADDRESS: 0.0.0.0
    volumes:
      - ./docker/mihomo-entrypoint.sh:/bootstrap/mihomo-entrypoint.sh:ro
      - frosted-proxy:/shared-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: Bearer $${MIHOMO_SECRET}\" http://127.0.0.1:9090/version >/dev/null 2>&1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
    networks:
      - proxy-internal

  frosted-console:
    build: .
    init: true
    shm_size: "1gb"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt:
      - seccomp=./docker/seccomp_profile.json
      - no-new-privileges:true
    restart: unless-stopped
    read_only: true
    pids_limit: 512
    mem_limit: 4g
    cpus: "2.0"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 2048
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2g
      - /run:rw,nosuid,nodev,size=64m
      - /home/pwuser:rw,exec,nosuid,nodev,size=1g
    depends_on:
      mihomo:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY must be set in .env}
      MASTER_KEY_ID: ${MASTER_KEY_ID:-active}
      PREVIOUS_MASTER_KEYS: ${PREVIOUS_MASTER_KEYS:-}
      BACKUP_DIR: /app/data/backups
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DASHBOARD_TURNSTILE_SITE_KEY: ${DASHBOARD_TURNSTILE_SITE_KEY:-}
      DASHBOARD_TURNSTILE_SECRET_KEY: ${DASHBOARD_TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SOLVER: ${TURNSTILE_SOLVER:-browser}
      TURNSTILE_HEADLESS: ${TURNSTILE_HEADLESS:-false}
      TURNSTILE_DISABLE_BROWSER_SANDBOX: ${TURNSTILE_DISABLE_BROWSER_SANDBOX:-false}
      TURNSTILE_BROWSER_CONCURRENCY: ${TURNSTILE_BROWSER_CONCURRENCY:-2}
      TURNSTILE_BROWSER_QUEUE_LIMIT: ${TURNSTILE_BROWSER_QUEUE_LIMIT:-20}
      TURNSTILE_BROWSER_SMOKE_ON_START: ${TURNSTILE_BROWSER_SMOKE_ON_START:-true}
      UPSTREAM_BROWSER_SESSION_TTL_HOURS: ${UPSTREAM_BROWSER_SESSION_TTL_HOURS:-168}
      DISPLAY: ${DISPLAY:-:99}
      NOVNC_ENABLED: ${NOVNC_ENABLED:-true}
      NOVNC_GEOMETRY: ${NOVNC_GEOMETRY:-1600x900x24}
      BROWSER_WORKSPACE_URL: ${BROWSER_WORKSPACE_URL:-http://localhost:6080/vnc.html?autoconnect=true&resize=remote&reconnect=true&path=websockify}
      MIHOMO_CONTROLLER_URL: http://mihomo:9090
      MIHOMO_SECRET: ${MIHOMO_SECRET:?MIHOMO_SECRET must be set in .env}
      MIHOMO_SHARED_DIR: /shared-proxy
      MIHOMO_RUNTIME_PATH: /shared-proxy/config.yaml
      MIHOMO_BIND_ADDRESS: 0.0.0.0
      MIHOMO_CONTROLLER_BIND_ADDRESS: 0.0.0.0
      UPSTREAM_PROXY_HOST: mihomo
      PROXY_BASE_PORT: ${PROXY_BASE_PORT:-17890}
      UPSTREAM_RESPONSE_MAX_BYTES: ${UPSTREAM_RESPONSE_MAX_BYTES:-2097152}
      UPSTREAM_ALLOWED_HOSTS: ${UPSTREAM_ALLOWED_HOSTS:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - frosted-data:/app/data
      - frosted-backups:/app/data/backups
      - frosted-proxy:/shared-proxy
    networks:
      - proxy-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  frosted-data:
  frosted-backups:
  frosted-proxy:

networks:
  proxy-internal:
    driver: bridge
